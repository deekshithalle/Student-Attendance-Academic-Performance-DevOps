apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: student-attendance-container
          image: student-attendance-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance-service
spec:
  type: NodePort
  selector:
    app: student-attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081
